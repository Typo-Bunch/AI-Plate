name: Build & Release Windows Executable

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag / Release version (e.g. v1.0.0)'
        required: false
        default: 'v1.0.0'
      release_title:
        description: 'Custom Release Title (optional, defaults to title in RELEASE_NOTES.md)'
        required: false
        default: ''
      prerelease:
        description: 'Mark as Pre-release'
        required: false
        type: boolean
        default: false
      draft:
        description: 'Save as Draft Release'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build-windows-exe:
    name: Package Windows NSIS Installer (.exe)
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm install --ignore-scripts

      - name: Setup Bundled Python Runtime
        run: npm run setup:python

      - name: Compile TypeScript & Preload Assets
        run: npm run build

      - name: Build Windows Installer Executable
        run: npx electron-builder --win nsis --publish never --config electron-builder.json

      - name: Resolve Release Metadata
        id: meta
        shell: bash
        run: |
          TAG="${{ github.event.inputs.tag_name || github.ref_name }}"
          CUSTOM_TITLE="${{ github.event.inputs.release_title }}"

          TITLE=""
          if [ -n "$CUSTOM_TITLE" ]; then
            TITLE="$CUSTOM_TITLE"
          elif [ -f "RELEASE_NOTES.md" ]; then
            TITLE=$(node -e "const fs=require('fs'); const m=fs.readFileSync('RELEASE_NOTES.md','utf8').match(/^#\s+(.+)$/m); console.log(m ? m[1].replace(/<[^>]+>/g, '').trim() : '');")
          fi

          if [ -z "$TITLE" ]; then
            TITLE="AI Plate $TAG"
          fi

          IS_PRERELEASE="false"
          INPUT_PRERELEASE="${{ github.event.inputs.prerelease }}"
          if [ "$INPUT_PRERELEASE" = "true" ] || [[ "$TAG" =~ -(rc|beta|alpha) ]]; then
            IS_PRERELEASE="true"
          fi

          IS_DRAFT="${{ github.event.inputs.draft || 'false' }}"

          echo "Resolved Tag: $TAG"
          echo "Resolved Title: $TITLE"
          echo "Prerelease: $IS_PRERELEASE"
          echo "Draft: $IS_DRAFT"

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "title=$TITLE" >> "$GITHUB_OUTPUT"
          echo "prerelease=$IS_PRERELEASE" >> "$GITHUB_OUTPUT"
          echo "draft=$IS_DRAFT" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.meta.outputs.tag }}"
          TITLE="${{ steps.meta.outputs.title }}"
          IS_PRERELEASE="${{ steps.meta.outputs.prerelease }}"
          IS_DRAFT="${{ steps.meta.outputs.draft }}"

          EDIT_FLAGS=()
          CREATE_FLAGS=()

          if [ "$IS_DRAFT" = "true" ]; then
            EDIT_FLAGS+=(--draft)
            CREATE_FLAGS+=(--draft)
          else
            EDIT_FLAGS+=(--draft=false)
          fi

          if [ "$IS_PRERELEASE" = "true" ]; then
            EDIT_FLAGS+=(--prerelease)
            CREATE_FLAGS+=(--prerelease)
          else
            EDIT_FLAGS+=(--latest)
            CREATE_FLAGS+=(--latest)
          fi

          NOTES_ARGS=()
          if [ -f "RELEASE_NOTES.md" ]; then
            NOTES_ARGS=(--notes-file "RELEASE_NOTES.md")
          else
            NOTES_ARGS=(--generate-notes)
          fi

          # Collect release artifacts from release/
          FILES=()
          for f in release/*.exe release/*.blockmap release/latest.yml; do
            if [ -f "$f" ]; then
              FILES+=("$f")
            fi
          done

          if [ ${#FILES[@]} -eq 0 ]; then
            echo "Error: No release artifacts found in release/ directory!"
            exit 1
          fi

          echo "Artifacts to upload:"
          for f in "${FILES[@]}"; do
            echo " - $f"
          done

          # Check if release exists on GitHub
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists. Updating title, release notes, and uploading assets..."
            gh release edit "$TAG" --title "$TITLE" "${NOTES_ARGS[@]}" "${EDIT_FLAGS[@]}"
            gh release upload "$TAG" "${FILES[@]}" --clobber
          else
            echo "Creating new release for $TAG with title '$TITLE'..."
            gh release create "$TAG" "${FILES[@]}" --title "$TITLE" "${NOTES_ARGS[@]}" "${CREATE_FLAGS[@]}"
          fi

          echo "Release successfully published!"
